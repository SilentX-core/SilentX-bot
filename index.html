<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentX Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">
            <div class="logo">SilentX</div>

            <nav>
                <button class="nav-item active">Dashboard</button>
                <button class="nav-item">Bots</button>
                <button class="nav-item">Tasks</button>
                <button class="nav-item">Logs</button>
                <button class="nav-item">Settings</button>
            </nav>
        </aside>

        <main class="main">

            <header class="topbar">
                <div>
                    <h1>Dashboard</h1>
                    <p>SilentX Control Center</p>
                </div>

                <div class="status">
                    <span></span>
                    Backend Offline
                </div>
            </header>

            <section class="bot-tabs">
                <button class="bot-tab active">
                    SilentX-discord
                </button>

                <button class="bot-tab">
                    SilentX-telegram
                </button>
            </section>

            <section class="cards">

                <div class="card">
                    <small>Bots</small>
                    <strong>0</strong>
                    <span>Online</span>
                </div>

                <div class="card">
                    <small>Tasks</small>
                    <strong>0</strong>
                    <span>Running</span>
                </div>

                <div class="card">
                    <small>Earnings</small>
                    <strong>0</strong>
                    <span>Total</span>
                </div>

                <div class="card">
                    <small>Uptime</small>
                    <strong>0m</strong>
                    <span>System</span>
                </div>

            </section>

            <section class="panel">

                <div class="panel-header">
                    <div>
                        <h2>System Overview</h2>
                        <p>Waiting for backend connection...</p>
                    </div>

                    <button class="primary">
                        Refresh
                    </button>
                </div>

                <div class="empty">
                    <div class="empty-icon">◈</div>
                    <h3>Backend chưa kết nối</h3>
                    <p>
                        Bước tiếp theo sẽ kết nối dashboard này
                        với Node.js localhost.
                    </p>
                </div>

            </section>

        </main>

    </div>

    <script src="app.js"></script>

</body>
</html>
