<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>SilentX | Đăng nhập</title><link rel="stylesheet" href="./style.css"></head><body class="loginpage"><main class="loginbox"><b class="logo">SX</b><small>CONTROL CENTER</small><h1>Chào mừng trở lại</h1><p>Đăng nhập bảng điều khiển Discord × Telegram.</p><form id="f"><label>Tên đăng nhập<input name="username" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Đăng nhập →</button><div id="err"></div></form></main><script src="./config.js"></script><script>const API=(window.API_BASE_URL||"").replace(/\\/$/,"");f.onsubmit=async e=>{e.preventDefault();err.textContent="";try{let r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json().catch(()=>({}));if(r.ok)location.href="./index.html";else err.textContent=d.error||"Đăng nhập thất bại"}catch(x){err.textContent="Không kết nối backend. Kiểm tra config.js."}}</script></body></html>
