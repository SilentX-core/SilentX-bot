<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Control Center Login</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="login">
  <form id="loginForm">
    <div class="logo">CC</div>
    <small>DISCORD × TELEGRAM</small>
    <h1>Control Center</h1>
    <p>Đăng nhập quản trị</p>
    <input name="username" placeholder="Tên đăng nhập" required>
    <input name="password" type="password" placeholder="Mật khẩu" required>
    <button type="submit">Đăng nhập →</button>
    <p id="err"></p>
  </form>
  <script src="./config.js"></script>
  <script>
    const API = (window.API_BASE_URL || "").replace(/\\/$/, "");
    const form = document.getElementById("loginForm");
    const err = document.getElementById("err");
    form.onsubmit = async event => {
      event.preventDefault();
      err.textContent = "";
      try {
        const response = await fetch(API + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        const result = await response.json().catch(() => ({}));
        if (response.ok) location.href = "./index.html";
        else err.textContent = result.error || "Đăng nhập thất bại";
      } catch (_) {
        err.textContent = "Không kết nối được backend. Kiểm tra config.js và HTTPS.";
      }
    };
  </script>
</body>
</html>
